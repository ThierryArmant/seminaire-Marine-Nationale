<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inscriptions Séminaires Marine Nationale</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #001220; color: white; padding: 15px; margin: 0; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #f1c40f; text-transform: uppercase; font-size: 1.4rem; margin-bottom: 5px; }
        
        .marine-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* --- TAILLE DES CARTES --- */
        /* Par défaut (Ordinateur) */
        .flip-card { height: 480px; perspective: 1000px; cursor: pointer; }

        /* Ajustement Mobile (Écrans < 600px) */
        @media screen and (max-width: 600px) {
            .flip-card { height: 320px !important; } /* On force une taille réduite */
            .front h3 { font-size: 0.9rem !important; padding: 8px !important; }
            .res-zone { padding: 8px !important; margin-bottom: 8px !important; }
            .btn-send { padding: 8px !important; font-size: 0.8rem !important; }
            .room-tag { font-size: 0.75rem !important; margin-bottom: 8px !important; }
            input[type="email"] { padding: 7px !important; font-size: 0.8rem !important; }
        }

        /* --- STRUCTURE FLIP --- */
        .flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .flip-card:hover .flip-card-inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; display: flex; flex-direction: column; box-sizing: border-box; }
        
        .front { background-size: cover; background-position: center; justify-content: flex-end; padding: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .front h3 { background: rgba(0, 33, 71, 0.95); padding: 10px; border-radius: 5px; border: 1px solid #f1c40f; margin: 0; text-align: center; }
        
        .back { background-color: #002147; transform: rotateY(180deg); border: 2px solid #f1c40f; justify-content: center; padding: 15px; }
        .room-tag { color: #f1c40f; text-align: center; font-weight: bold; }
        .res-zone { background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(241, 196, 15, 0.2); }
        input[type="email"] { width: 100%; border-radius: 4px; border: none; background: white; color: black; }
        .btn-send { background: #f1c40f; color: #002147; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h1>⚓ Inscriptions Séminaires</h1>
    <p>Survolez ou tapez sur une carte</p>
</div>

<div class="marine-grid">
    <!-- CARTE 1 -->
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="front" style="background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=600');">
                <h3>Cartographier l'action et les enjeux</h3>
            </div>
            <div class="back">
                <div class="room-tag">📍 Salle B104</div>
                <div class="res-zone"><label>MATIN : 10h45</label><input type="email" id="e1_1" placeholder="Email..."><button class="btn-send" onclick="reserver('Carto', '10h45', 'e1_1')">Réserver</button></div>
                <div class="res-zone"><label>A-M : 15h00</label><input type="email" id="e1_2" placeholder="Email..."><button class="btn-send" onclick="reserver('Carto', '15h00', 'e1_2')">Réserver</button></div>
            </div>
        </div>
    </div>

    <!-- CARTE 2 -->
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="front" style="background-image: url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600');">
                <h3>L'image au service des programmes</h3>
            </div>
            <div class="back">
                <div class="room-tag">📍 Salle B105</div>
                <div class="res-zone"><label>MATIN : 10h45</label><input type="email" id="e2_1" placeholder="Email..."><button class="btn-send" onclick="reserver('Image', '10h45', 'e2_1')">Réserver</button></div>
                <div class="res-zone"><label>A-M : 15h00</label><input type="email" id="e2_2" placeholder="Email..."><button class="btn-send" onclick="reserver('Image', '15h00', 'e2_2')">Réserver</button></div>
            </div>
        </div>
    </div>

    <!-- CARTE 3 -->
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="front" style="background-image: url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=600');">
                <h3>Construire une Classe de Défense</h3>
            </div>
            <div class="back">
                <div class="room-tag">📍 Salle B108</div>
                <div class="res-zone"><label>MATIN : 10h45</label><input type="email" id="e3_1" placeholder="Email..."><button class="btn-send" onclick="reserver('CDSG', '10h45', 'e3_1')">Réserver</button></div>
                <div class="res-zone"><label>A-M : 15h00</label><input type="email" id="e3_2" placeholder="Email..."><button class="btn-send" onclick="reserver('CDSG', '15h00', 'e3_2')">Réserver</button></div>
            </div>
        </div>
    </div>

    <!-- CARTE 4 -->
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="front" style="background-image: url('https://images.unsplash.com/photo-1520437358207-323b43b50729?w=600');">
                <h3>Missions navales et HGGSP</h3>
            </div>
            <div class="back">
                <div class="room-tag">📍 Salle B110</div>
                <div class="res-zone"><label>MATIN : 10h45</label><input type="email" id="e4_1" placeholder="Email..."><button class="btn-send" onclick="reserver('HGGSP', '10h45', 'e4_1')">Réserver</button></div>
                <div class="res-zone"><label>A-M : 15h00</label><input type="email" id="e4_2" placeholder="Email..."><button class="btn-send" onclick="reserver('HGGSP', '15h00', 'e4_2')">Réserver</button></div>
            </div>
        </div>
    </div>

    <!-- CARTE 5 -->
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="front" style="background-image: url('https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=600');">
                <h3>La Marine au féminin</h3>
            </div>
            <div class="back">
                <div class="room-tag">📍 SalLE B111</div>
                <div class="res-zone"><label>MATIN : 10h45</label><input type="email" id="e5_1" placeholder="Email..."><button class="btn-send" onclick="reserver('Femme', '10h45', 'e5_1')">Réserver</button></div>
                <div class="res-zone"><label>A-M : 15h00</label><input type="email" id="e5_2" placeholder="Email..."><button class="btn-send" onclick="reserver('Femme', '15h00', 'e5_2')">Réserver</button></div>
            </div>
        </div>
    </div>
</div>

<script>
function reserver(seminaire, creneau, inputId) {
    const email = document.getElementById(inputId).value;
    if(!email || !email.includes('@')) { alert("Email invalide"); return; }
    const url = "https://script.google.com/macros/s/AKfycbzDK_8eI_omVTgURetY0mjJjDnCb0oKCF8FIzn_3Qep7laxKFLQz3bqBZIfYDnRL0te/exec";
    fetch(url, { method: "POST", mode: "no-cors", body: JSON.stringify({ seminaire: seminaire, creneau: creneau, email: email }) })
    .then(() => { alert("Inscrit à : " + seminaire); document.getElementById(inputId).value = ""; });
}
</script>

</body>
</html>
